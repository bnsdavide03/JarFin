<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Storico Transazioni - JarFin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .type-badge { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="fas fa-arrow-left me-2 text-warning"></i> Torna alla Dashboard</a>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0"><i class="fas fa-list-ul me-2 text-primary"></i>Storico Completo Transazioni</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Data</th>
                            <th>Descrizione</th>
                            <th>Categoria</th>
                            <th class="text-end pe-4">Importo</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${transactions}">
                            <td class="ps-4">
                                <div class="d-flex align-items-center">
                                    <div th:class="${t.type == 'INCOME' ? 'type-badge bg-success-subtle text-success' : 'type-badge bg-danger-subtle text-danger'} " class="me-3">
                                        <i th:class="${t.type == 'INCOME' ? 'fas fa-arrow-up' : 'fas fa-arrow-down'}"></i>
                                    </div>
                                    <span th:text="${t.date}">2026-02-02</span>
                                </div>
                            </td>
                            <td><span class="fw-bold" th:text="${t.description}">Descrizione</span></td>
                            <td><span class="badge bg-light text-dark text-capitalize" th:text="${t.category}">Categoria</span></td>
                            <td class="text-end pe-4">
                                <span th:class="${t.type == 'INCOME' ? 'text-success fw-bold' : 'text-danger fw-bold'}">
                                    <span th:text="${t.type == 'INCOME' ? '+' : '-'}"></span>
                                    <span th:text="${#numbers.formatDecimal(t.amount, 1, 'POINT', 2, 'COMMA')}">0,00</span> €
                                </span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(transactions)}">
                            <td colspan="4" class="text-center py-5 text-muted">Nessuna transazione registrata.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
